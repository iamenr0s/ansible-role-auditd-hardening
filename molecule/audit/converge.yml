---
- name: Converge (audit only)
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Audit
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../.."  # noqa: role-name[path]
      vars:
        linux_hardening_mode: audit
        linux_hardening_fail_on_error: false

    - name: Findings are a list
      ansible.builtin.assert:
        that: linux_hardening_auditd_findings is sequence
        quiet: true

    - name: Nothing was written
      ansible.builtin.stat:
        path: /etc/audit/rules.d/99-linux-hardening.rules
      register: __f
      failed_when: __f.stat.exists
