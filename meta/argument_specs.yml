---
argument_specs:
  main:
    short_description: Audit and set auditd.conf, a managed audit rules file and the service state.
    options:
      linux_hardening_mode: {type: str, default: audit, choices: [audit, remediate], description: "audit is read-only."}
      linux_hardening_confirm_remediation: {type: bool, default: false, description: "Must be true before remediate changes anything."}
      linux_hardening_backup: {type: bool, default: true, description: "Back up auditd.conf and the rules file when they change."}
      linux_hardening_verify: {type: bool, default: true, description: "Re-audit after remediation."}
      linux_hardening_fail_on_error: {type: bool, default: true, description: "Fail the play when audit finds deviations."}
      linux_hardening_auditd_enabled: {type: bool, default: true, description: "Run the role."}
      linux_hardening_auditd_conf_file: {type: path, default: /etc/audit/auditd.conf, description: "auditd.conf to manage."}
      linux_hardening_auditd_rules_file: {type: path, default: /etc/audit/rules.d/99-linux-hardening.rules, description: "Managed rules file."}
      linux_hardening_auditd_conf: {type: dict, default: {}, description: "auditd.conf settings {key: value} over the built-in set."}
      linux_hardening_auditd_exclude_groups: {type: list, elements: str, default: [], description: "Rule groups to leave out."}
      linux_hardening_auditd_extra_rules: {type: list, elements: str, default: [], description: "Raw rule lines appended to the managed file."}
      linux_hardening_auditd_immutable: {type: bool, default: false, description: "Append -e 2: rules cannot change until reboot."}
