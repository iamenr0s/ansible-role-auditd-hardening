---
# audit: read-only. remediate: packages, auditd.conf, rules file, service, rule load. Never reboots.
- name: Run auditd_hardening
  when: linux_hardening_auditd_enabled | bool
  block:
    # virtual: container detection must not fall back to 'host' when facts are off or minimal.
    - name: Gather the facts the role needs (os_family, virtualization_type)
      ansible.builtin.setup:
        gather_subset: [min, virtual]
      when: ansible_facts['os_family'] is not defined or ansible_facts['virtualization_type'] is not defined

    - name: Skip other OS families
      ansible.builtin.set_fact:
        linux_hardening_auditd_findings: []
      when: ansible_facts['os_family'] not in ['RedHat', 'Debian']

    - name: Say why the role was skipped
      ansible.builtin.debug:
        msg: "auditd_hardening supports the RedHat and Debian families; {{ ansible_facts['os_family'] }} is skipped."
      when: ansible_facts['os_family'] not in ['RedHat', 'Debian']

    - name: Run on a supported family
      when: ansible_facts['os_family'] in ['RedHat', 'Debian']
      block:
        - name: Audit (read-only)
          ansible.builtin.include_tasks: audit.yml
          when: linux_hardening_mode == 'audit'

        - name: Remediate
          when: linux_hardening_mode == 'remediate'
          block:
            - name: Require explicit remediation confirmation
              ansible.builtin.assert:
                that: linux_hardening_confirm_remediation | bool
                fail_msg: >-
                  Remediation installs auditd, rewrites its configuration and loads audit rules. Set
                  linux_hardening_confirm_remediation: true to proceed (run with linux_hardening_mode: audit to preview).
                quiet: true

            - name: Configure
              ansible.builtin.include_tasks: configure.yml

            - name: Verify effective configuration
              ansible.builtin.include_tasks: audit.yml
              vars:
                __lh_au_audit_fatal: true
              # In check mode nothing was written, so a re-audit would always fail.
              when: linux_hardening_verify | bool and not ansible_check_mode
