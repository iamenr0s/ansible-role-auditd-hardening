---
# Read-only. Sets the __lh_au_* facts the audit and configure steps compare with.
- name: Gather package facts
  ansible.builtin.package_facts:

- name: Look at the watch paths
  ansible.builtin.stat:
    path: "{{ item.path }}"
    get_checksum: false
  loop: "{{ __linux_hardening_auditd_watches | rejectattr('group', 'in', linux_hardening_auditd_exclude_groups) | list }}"
  loop_control:
    label: "{{ item.path }}"
  register: __lh_au_watch_stats

# Only watches on paths that exist: auditctl rejects a watch on a missing path and would abort the whole load.
- name: Keep the watches that can be loaded
  ansible.builtin.set_fact:
    __lh_au_watches: "{{ __lh_au_watch_stats.results | selectattr('stat.exists') | map(attribute='item') | list }}"

- name: Render the rules file
  ansible.builtin.set_fact:
    __lh_au_rules: "{{ lookup('ansible.builtin.template', 'rules.j2') }}"
    __lh_au_installed: "{{ __linux_hardening_auditd_package in ansible_facts['packages'] }}"

- name: Read auditd.conf and the rules file
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop: ["{{ linux_hardening_auditd_conf_file }}", "{{ linux_hardening_auditd_rules_file }}"]
  register: __lh_au_files
  failed_when: false

- name: Stat the rules file
  ansible.builtin.stat:
    path: "{{ linux_hardening_auditd_rules_file }}"
  register: __lh_au_rules_stat

- name: Ask the kernel (needs the audit netlink socket; absent in containers)
  ansible.builtin.command: "{{ item }}"
  loop: [auditctl -s, auditctl -l, augenrules --check]
  register: __lh_au_ctl
  changed_when: false
  failed_when: false
  when: __lh_au_installed | bool

- name: Query the auditd unit
  ansible.builtin.systemd:
    name: auditd
  register: __lh_au_unit
  failed_when: false

- name: Read the kernel command line
  ansible.builtin.slurp:
    src: /proc/cmdline
  register: __lh_au_cmdline

- name: Work out the audit state
  ansible.builtin.set_fact:
    __lh_au_conf_have: >-
      {%- set d = {} -%}
      {%- for line in (__lh_au_files.results[0].content | default('') | b64decode).splitlines() -%}
      {%- set l = line.split('#')[0] -%}
      {%- if '=' in l -%}{%- set _ = d.update({l.split('=')[0] | trim: l.split('=', 1)[1] | trim}) -%}{%- endif -%}
      {%- endfor -%}
      {{ d | to_json }}
    __lh_au_conf_want: >-
      {{ __linux_hardening_auditd_conf_base | combine(linux_hardening_auditd_conf) }}
    # The audit subsystem belongs to the host kernel: a container must never touch its rules or daemon.
    __lh_au_container: "{{ ansible_facts['virtualization_type'] | default('') in ['docker', 'podman', 'container', 'lxc', 'nspawn', 'systemd-nspawn', 'openvz'] }}"
    __lh_au_kernel: "{{ (__lh_au_installed | bool) and __lh_au_ctl.results[0].rc == 0 and ansible_facts['virtualization_type'] | default('') not in ['docker', 'podman', 'container', 'lxc', 'nspawn', 'systemd-nspawn', 'openvz'] }}"
    __lh_au_enabled: >-
      {{ (__lh_au_ctl.results[0].stdout | regex_findall('(?m)^enabled (\d)') | first | default('0')) if (__lh_au_installed | bool) and __lh_au_ctl.results[0].rc == 0 else '' }}
    __lh_au_loaded_keys: >-
      {{ (__lh_au_ctl.results[1].stdout | default('') | regex_findall('(?:-k |key=)(\S+)')) if (__lh_au_installed | bool) else [] }}
    __lh_au_stale: "{{ (__lh_au_installed | bool) and __lh_au_ctl.results[2].rc | default(0) != 0 }}"

- name: Work out which rules are missing from the kernel
  ansible.builtin.set_fact:
    __lh_au_wanted_keys: "{{ __lh_au_rules | regex_findall('(?m)^-.* -k (\\S+)$') | unique }}"
    __lh_au_locked: "{{ __lh_au_enabled == '2' }}"

- name: Compare the keys
  ansible.builtin.set_fact:
    __lh_au_missing_keys: "{{ __lh_au_wanted_keys | difference(__lh_au_loaded_keys) }}"
    __lh_au_need_load: >-
      {{ __lh_au_kernel | bool and (
           (__lh_au_wanted_keys | difference(__lh_au_loaded_keys) | length > 0)
           or (__lh_au_stale | bool)
           or (linux_hardening_auditd_immutable | bool and __lh_au_enabled != '2')) }}
