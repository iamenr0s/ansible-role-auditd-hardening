---
- name: audit | Gather auditd state
  ansible.builtin.include_tasks: facts.yml

# Each task below adds one finding to the list when its check fails. With the package missing,
# that is the only finding: everything else depends on it.
- name: audit | Start with no findings
  ansible.builtin.set_fact:
    linux_hardening_auditd_findings: []

- name: audit | Check the audit package
  ansible.builtin.set_fact:
    linux_hardening_auditd_findings: "{{ linux_hardening_auditd_findings + [finding] }}"
  vars:
    finding: {key: "package {{ __linux_hardening_auditd_package }}", expected: installed, actual: missing, fixable: true}
  when: not __lh_au_installed | bool

- name: audit | Check the installed auditd
  when: __lh_au_installed | bool
  vars:
    __lh_au_unit_status: "{{ __lh_au_unit.status | default({}) }}"
    __lh_au_conf_read: "{{ __lh_au_files.results[0].content is defined }}"
  block:
    - name: audit | Check auditd.conf exists
      ansible.builtin.set_fact:
        linux_hardening_auditd_findings: "{{ linux_hardening_auditd_findings + [finding] }}"
      vars:
        finding: {key: "{{ linux_hardening_auditd_conf_file }}", expected: present, actual: missing, fixable: false}
      when: not __lh_au_conf_read | bool

    - name: audit | Check the auditd.conf settings
      ansible.builtin.set_fact:
        linux_hardening_auditd_findings: "{{ linux_hardening_auditd_findings + [finding] }}"
      vars:
        finding:
          key: "auditd.conf {{ item.key }}"
          expected: "{{ item.value | string }}"
          actual: "{{ __lh_au_conf_have[item.key] | default('unset') }}"
          fixable: true
      loop: "{{ __lh_au_conf_want | dict2items if __lh_au_conf_read | bool else [] }}"
      loop_control:
        label: "{{ item.key }}"
      when: __lh_au_conf_have[item.key] | default(none) != item.value | string

    - name: audit | Check the rules file
      ansible.builtin.set_fact:
        linux_hardening_auditd_findings: "{{ linux_hardening_auditd_findings + [finding] }}"
      vars:
        finding:
          key: "rules file {{ linux_hardening_auditd_rules_file }}"
          expected: present (0640) with the desired rules
          actual: missing or different
          fixable: true
      when: >-
        __lh_au_files.results[1].content is not defined
        or (__lh_au_files.results[1].content | b64decode) != __lh_au_rules
        or __lh_au_rules_stat.stat.mode | default('') != '0640'

    - name: audit | Check the service is enabled
      ansible.builtin.set_fact:
        linux_hardening_auditd_findings: "{{ linux_hardening_auditd_findings + [finding] }}"
      vars:
        finding:
          key: auditd.service enabled
          expected: enabled
          actual: "{{ __lh_au_unit_status.UnitFileState | default('unknown') }}"
          fixable: true
      when: __lh_au_unit_status.UnitFileState | default('') not in ['enabled', 'static']

    - name: audit | Check the service is running
      ansible.builtin.set_fact:
        linux_hardening_auditd_findings: "{{ linux_hardening_auditd_findings + [finding] }}"
      vars:
        finding:
          key: auditd.service active
          expected: running
          actual: "{{ __lh_au_unit_status.ActiveState | default('unknown') }}"
          fixable: true
      when:
        - __lh_au_kernel | bool
        - __lh_au_unit_status.ActiveState | default('') != 'active'

    - name: audit | Check the rules loaded in the kernel
      ansible.builtin.set_fact:
        linux_hardening_auditd_findings: "{{ linux_hardening_auditd_findings + [finding] }}"
      vars:
        finding:
          key: rules loaded in the kernel
          expected: "all keys loaded{{ ' and immutable (-e 2)' if linux_hardening_auditd_immutable | bool else '' }}"
          actual: >-
            {{ ('missing keys ' ~ __lh_au_missing_keys | join(',')) if __lh_au_missing_keys
               else 'merged audit.rules stale or not immutable' ~ (' (locked by -e 2: reboot to change)' if __lh_au_locked | bool else '') }}
          fixable: "{{ not __lh_au_locked | bool }}"
      when:
        - __lh_au_kernel | bool
        - __lh_au_need_load | bool

    - name: audit | Report that the kernel audit interface is out of reach
      ansible.builtin.set_fact:
        linux_hardening_auditd_findings: "{{ linux_hardening_auditd_findings + [finding] }}"
      vars:
        finding:
          key: kernel audit interface
          expected: reachable
          actual: >-
            {{ "running in a container: the audit subsystem is the host kernel's" if __lh_au_container | bool
               else 'auditctl -s fails (no audit support): runtime state not checked' }}, so rules and daemon are not managed
          fixable: false
      when: not __lh_au_kernel | bool

    - name: audit | Check the audit=1 kernel parameter
      ansible.builtin.set_fact:
        linux_hardening_auditd_findings: "{{ linux_hardening_auditd_findings + [finding] }}"
      vars:
        finding:
          key: kernel parameter audit=1
          expected: present
          actual: "absent (reported only: bootloader; processes before auditd starts go unaudited)"
          fixable: false
      when: "'audit=1' not in (__lh_au_cmdline.content | b64decode).split()"

- name: audit | Report auditd_hardening result
  ansible.builtin.debug:
    msg: "{{ 'COMPLIANT' if linux_hardening_auditd_findings | length == 0 else linux_hardening_auditd_findings }}"

# After remediation only fixable findings fail the run; the kernel parameter and a container need a human.
- name: audit | Fail on findings
  ansible.builtin.fail:
    msg: "auditd_hardening found {{ linux_hardening_auditd_findings | length }} deviation(s)."
  when:
    - not __lh_au_audit_fatal | default(false)
    - linux_hardening_fail_on_error | bool
    - linux_hardening_auditd_findings | length > 0

- name: audit | Fail on fixable findings left after remediation
  ansible.builtin.fail:
    msg: "auditd_hardening left {{ linux_hardening_auditd_findings | selectattr('fixable') | list | length }} fixable deviation(s)."
  when:
    - __lh_au_audit_fatal | default(false)
    - linux_hardening_auditd_findings | selectattr('fixable') | list | length > 0
