---
- name: configure | Install the audit package (Debian family)
  ansible.builtin.apt:
    name: "{{ __linux_hardening_auditd_package }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == 'Debian'

- name: configure | Install the audit package (RedHat family)
  ansible.builtin.dnf:
    name: "{{ __linux_hardening_auditd_package }}"
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: configure | Gather auditd state
  ansible.builtin.include_tasks: facts.yml

- name: configure | Write auditd.conf settings
  ansible.builtin.lineinfile:
    path: "{{ linux_hardening_auditd_conf_file }}"
    regexp: "^\\s*{{ item.key | regex_escape }}\\s*="
    line: "{{ item.key }} = {{ item.value }}"
    backup: "{{ linux_hardening_backup | bool }}"
  loop: "{{ __lh_au_conf_want | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: __lh_au_files.results[0].content is defined
  register: __lh_au_conf_written

- name: configure | Write the rules file
  ansible.builtin.copy:
    content: "{{ __lh_au_rules }}"
    dest: "{{ linux_hardening_auditd_rules_file }}"
    owner: root
    group: root
    mode: "0640"
    backup: "{{ linux_hardening_backup | bool }}"
  register: __lh_au_rules_written

- name: configure | Enable the service
  ansible.builtin.systemd:
    name: auditd
    enabled: true
  # In check mode a simulated install leaves no unit to act on.
  when: __lh_au_installed | bool or not ansible_check_mode

# Only where the kernel accepts audit control: in a container the daemon cannot open its netlink socket.
- name: configure | Start the service
  ansible.builtin.systemd:
    name: auditd
    state: started
  when: __lh_au_kernel | bool

- name: configure | Query the auditd unit
  ansible.builtin.systemd:
    name: auditd
  register: __lh_au_unit
  # In check mode a simulated install leaves no unit to act on.
  when: __lh_au_installed | bool or not ansible_check_mode

# auditd re-reads auditd.conf on SIGHUP. Its unit has no reload action and RHEL refuses a manual restart.
- name: configure | Reload auditd after a configuration change
  ansible.builtin.command: systemctl kill --signal=HUP auditd  # noqa: command-instead-of-module
  changed_when: true
  when:
    - __lh_au_conf_written is changed
    - __lh_au_unit.status.ActiveState | default('') == 'active'

- name: configure | Re-read what the kernel has loaded
  ansible.builtin.include_tasks: facts.yml

# augenrules merges rules.d into audit.rules and loads it. When -e 2 is already active the kernel refuses it;
# that case is a (non-fixable) finding, not an error.
- name: configure | Load the rules
  ansible.builtin.command: augenrules --load
  when:
    - __lh_au_need_load | bool
    - not (__lh_au_locked | bool)
  changed_when: true
